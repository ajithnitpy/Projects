version: "3.9"

# ---------------------------------------------------------------------------
# Ryu SDN Dashboard — full stack
#
# Services:
#   db       Postgres 15
#   redis    Channels backend
#   ryu      Custom Ryu controller (ports 6633/6653 for switches, 8080/8081 REST)
#   web      Django dashboard (Daphne on :8000)
#   nginx    Reverse proxy on :80
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ryu_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-ryu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ryu}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ryu:
    build: { context: ., dockerfile: Dockerfile.ryu }
    ports:
      - "6633:6633"   # OpenFlow 1.0
      - "6653:6653"   # OpenFlow 1.3
      - "8080:8080"   # ofctl_rest + topology
      - "8081:8081"   # custom security REST
    environment:
      DJANGO_API: http://web:8000
    depends_on: [web]

  web:
    build: { context: ., dockerfile: Dockerfile }
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ryu_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-ryu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ryu}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RYU_REST_URL: http://ryu:8080
      RYU_OFCTL_URL: http://ryu:8080
      CUSTOM_RYU_APP_URL: http://ryu:8081
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 ryu_dashboard.asgi:application"
    expose: ["8000"]

  nginx:
    image: nginx:1.25-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]

volumes:
  pgdata:
