# /etc/nginx/sites-available/ryu-dashboard
# Symlink into sites-enabled/ then `sudo nginx -t && sudo systemctl reload nginx`.

upstream daphne_upstream {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20M;

    location /static/ {
        alias /opt/ryu-dashboard/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://daphne_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://daphne_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
