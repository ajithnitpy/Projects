{% extends "dashboard/base.html" %}
{% block content %}
<div class="panel">
  <div class="panel-header"><h3>Network Topology</h3></div>
  <div class="panel-body">
    <svg id="topology-svg" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet" style="height:520px;width:100%"></svg>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
  let DATA = {{ topology_json|safe|default:"null" }};
  if (!DATA || !DATA.nodes || DATA.nodes.length === 0) {
    DATA = {nodes:[{id:'ctrl',label:'Ryu Controller',type:'controller'}],edges:[]};
  }
  const w = 900, h = 500;
  const svg = d3.select('#topology-svg');
  const sim = d3.forceSimulation(DATA.nodes)
    .force('link', d3.forceLink(DATA.edges).id(d => d.id).distance(110))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(w/2, h/2));
  const link = svg.append('g').selectAll('line').data(DATA.edges).enter()
    .append('line').attr('stroke','#94a3b8').attr('stroke-width',1.5);
  const node = svg.append('g').selectAll('g').data(DATA.nodes).enter()
    .append('g').call(d3.drag().on('drag', (e,d)=>{d.fx=e.x;d.fy=e.y;sim.alpha(0.3).restart();}));
  node.append('circle')
    .attr('r', d => d.type==='controller'?28:d.type==='switch'?20:14)
    .attr('fill', d => d.type==='controller'?'#3b82f6':d.type==='switch'?'#8b5cf6':'#22c55e')
    .attr('stroke','#0f172a').attr('stroke-width',2);
  node.append('text').attr('text-anchor','middle').attr('dy',4).attr('fill','white')
    .attr('font-size',11).text(d=>d.label);
  sim.on('tick', () => {
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
</script>
{% endblock %}
